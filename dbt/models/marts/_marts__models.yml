version: 2

models:
  - name: patients_features
    description: >
      int_patients_cleaned plus engineered features (clinical_symptoms_count).
      Patient-grain, human-readable (gender/diagnosis as text). Intended
      for EDA and data-quality checks upstream of ml_patients_dataset.
    columns:
      - name: patient_id
        description: See stg_patients.patient_id — not guaranteed unique.
        tests:
          - not_null
      - name: clinical_symptoms_count
        description: Count of the 10 clinical symptom flags present (0-10).
        tests:
          - not_null

  - name: ml_patients_dataset
    description: >
      Final, fully-numeric feature table for the ML team. One row per
      source record; patient_id dropped; gender/diagnosis ordinally
      encoded to match encoder/gender.json and encoder/diagnosis.json.
      This is the dbt equivalent of data/CleanedDataset.csv and should be
      the single source of truth the ML training pipeline reads from.

      DATA CONTRACT: this model is the hand-off interface to the ML/API
      team (FastAPI schema in app/main.py, models/*.pkl, the monitoring
      drift detector all depend on these exact column names and types).
      `contract.enforced: true` below makes dbt fail the build at compile
      time if a future change to this model silently renames, retypes,
      drops, or reorders a column relative to what's declared here --
      instead of that mismatch surfacing later as a runtime error in the
      API or a silent drift-detector false positive. Any intentional
      schema change must be reflected here AND communicated to Member 2
      (Deployment) and Member 7 (Monitoring) before merging.
    config:
      contract:
        enforced: true
    columns:
      - name: Age
        data_type: bigint
        tests: [not_null]
      - name: Sickness_Duration_Months
        data_type: bigint
        tests: [not_null]
      - name: RBC_Count
        data_type: double
        tests: [not_null]
      - name: Hemoglobin
        data_type: double
        tests: [not_null]
      - name: Hematocrit
        data_type: double
        tests: [not_null]
      - name: MCV
        data_type: double
      - name: MCH
        data_type: double
      - name: MCHC
        data_type: double
      - name: RDW
        data_type: double
      - name: Reticulocyte_Count
        data_type: double
      - name: WBC_Count
        data_type: double
        tests: [not_null]
      - name: Neutrophils
        data_type: double
      - name: Lymphocytes
        data_type: double
      - name: Monocytes
        data_type: double
      - name: Eosinophils
        data_type: double
      - name: Basophils
        data_type: double
      - name: PLT_Count
        data_type: double
      - name: MPV
        data_type: double
      - name: Esbach
        data_type: double
      - name: MBL_Level
        data_type: double
      - name: ESR
        data_type: double
        tests: [not_null]
      - name: C3
        data_type: double
      - name: C4
        data_type: double
        description: log1p-transformed in int_patients_cleaned (skew 2.02 -> 0.07).
      - name: ana
        data_type: bigint
      - name: crp
        data_type: double
      - name: anti_ds_dna
        data_type: bigint
        description: >
          Values survive dlt's snake_case collision between the source's
          "Anti-dsDNA" and "Anti_dsDNA" columns (only the underscore
          variant's values are kept). See _staging__sources.yml.
      - name: rheumatoid_factor
        data_type: double
      - name: acpa
        data_type: double
      - name: anti_tpo
        data_type: double
      - name: anti_tg
        data_type: double
      - name: anti_sma
        data_type: double
      - name: low_grade_fever
        data_type: bigint
      - name: fatigue_or_chronic_tiredness
        data_type: bigint
      - name: dizziness
        data_type: bigint
      - name: weight_loss
        data_type: bigint
      - name: rashes_and_skin_lesions
        data_type: bigint
      - name: stiffness_in_the_joints
        data_type: bigint
      - name: brittle_hair_or_hair_loss
        data_type: bigint
      - name: dry_eyes_and_or_mouth
        data_type: bigint
      - name: general_unwell_feeling
        data_type: bigint
      - name: joint_pain
        data_type: bigint
      - name: anti_enterocyte_antibodies
        data_type: bigint
      - name: anti_lkm1
        data_type: bigint
      - name: anti_rnp
        data_type: bigint
      - name: asca
        data_type: bigint
      - name: anti_bp230
        data_type: bigint
      - name: dgp
        data_type: bigint
      - name: anti_if
        data_type: bigint
      - name: ig_g_ig_e_receptor
        data_type: bigint
      - name: anti_srp
        data_type: bigint
      - name: anti_desmoglein_3
        data_type: bigint
      - name: anti_centromere
        data_type: bigint
      - name: anti_type_vii_collagen
        data_type: bigint
      - name: c1_inhibitor
        data_type: bigint
      - name: anti_epidermal_basement_membrane_ig_a
        data_type: bigint
      - name: p_anca
        data_type: bigint
      - name: anti_tissue_transglutaminase
        data_type: bigint
      - name: clinical_symptoms_count
        data_type: bigint
        description: Count of the 10 clinical symptom flags present (0-10).
        tests: [not_null]
      - name: gender
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: diagnosis
        data_type: integer
        description: Target label for the classification model.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
