  # ==========================================
  # 5. CONTENEURISATION (DOCKER INTEGRATION)
  # ==========================================
  docker-integration:
    name: Docker Full Stack Integration
    # needs: [ml-training-and-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Orchestrated DuckDB Artifact natively
        uses: actions/download-artifact@v4
        with:
          name: orchestrated-duckdb-database
          path: ./dataops/data/duckdb/

      - name: Allocate Swap Space to Prevent OOM
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build

      - name: Start Database and Services
        run: docker compose up -d

      - name: Wait for Backend to be Healthy
        run: |
          echo "Waiting for ML Backend container to start..."
          until curl -s http://localhost:8000/health | grep -q "healthy"; do
            sleep 3
          done
          echo "ML Backend is fully operational!"

      - name: Run Post-Docker E2E Integration Tests
        run: |
          chmod +x tests/e2e_integration.sh
          bash tests/e2e_integration.sh

      - name: Shut Down Stack
        if: always()
        run: docker compose down
  
  # ==========================================
  # 6. CI/CD -> DOCKERHUB PUSH
  # ==========================================
  docker-push:
    name: Push Images to DockerHub
    needs: [docker-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ml/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/autoimmune-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/autoimmune-frontend:latest

      - name: Build and Push Dagster
        uses: docker/build-push-action@v5
        with:
          context: ./dataops
          file: ./dataops/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/autoimmune-dagster:latest

      - name: Build and Push Monitoring
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./monitoring/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/autoimmune-monitoring:latest

      - name: Build and Push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./monitoring/dashboard/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/autoimmune-dashboard:latest
          

  # ==========================================
  # 7. AUTOMATED DEPLOYMENT (KOMODO) (BLANK)
  # ==========================================
  komodo-deploy:
    name: Automated Deployment (Komodo)
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo via Official SDK
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          npm install komodo_client
          cat << 'EOF' > deploy.mjs
          global.localStorage = { getItem: () => null, setItem: () => {} };
          const { KomodoClient } = await import("komodo_client");
          async function run() {
            const komodo = KomodoClient("https://komodo.s3.fsbm.ma", {
              type: "api-key",
              params: { key: process.env.KOMODO_API_KEY, secret: process.env.KOMODO_API_SECRET }
            });
            await komodo.execute("DeployStack", { stack: "autoimmune_detection_system" });
          }
          run().catch(err => { console.error(err); process.exit(1); });
          EOF
          node deploy.mjs

       
