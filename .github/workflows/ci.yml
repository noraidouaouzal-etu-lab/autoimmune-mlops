name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8 (style/errors)
        run: flake8 api dlt_pipeline monitoring dbt --max-line-length=120 --exclude=__pycache__ --extend-ignore=E203,W503
        continue-on-error: true

      - name: Check formatting with black
        run: black --check api dlt_pipeline monitoring
        continue-on-error: true

      - name: Check import order with isort
        run: isort --check-only api dlt_pipeline monitoring
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run API tests
        run: pytest tests/ -v --cov=api --cov-report=term-missing

      - name: Run monitoring tests
        run: pytest monitoring/tests/ -v
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage