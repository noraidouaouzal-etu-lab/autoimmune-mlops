name: Autoimmune MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # ==========================================
  # 0. CODE QUALITY (LINTING)
  # ==========================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8
        run: flake8 ml monitoring dataops --max-line-length=120 --exclude=__pycache__ --extend-ignore=E203,W503
        continue-on-error: true

      - name: Check formatting with black
        run: black --check ml monitoring dataops
        continue-on-error: true

      - name: Check import order with isort
        run: isort --check-only ml monitoring dataops
        continue-on-error: true

  # ==========================================
  # 1. SOURCES -> DLT (Ingestion & Unit Tests)
  # ==========================================
  data-pipeline-ingestion:
    name: Data Ingestion & Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Ingestion Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb dlt
          
      - name: Create Local DuckDB Directory
        working-directory: ./dataops
        run: mkdir -p data/duckdb
      
      - name: Run DataOps Unit Tests
        run: pytest tests/dataops/ -v
        continue-on-error: true

      - name: Hydrate DuckDB Database (Ingestion)
        working-directory: ./dataops
        run: |
          mkdir -p data/duckdb
          python ingest_dlt.py 

      - name: Upload DuckDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-database
          path: ./dataops/data/duckdb/autoimmune.duckdb
          retention-days: 1

  # ==========================================
  # 2. DUCKDB -> DBT -> TESTS QUALITÉ
  # ==========================================
  data-quality-contracts:
    name: dbt Data Contracts & Quality
    needs: [data-pipeline-ingestion]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dbt Requirements
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb
          
      - name: Recreate Mock Docker Path
        run: |
          sudo mkdir -p /app/data/duckdb
          sudo chown -R $USER:$USER /app
          
      - name: Download DuckDB Artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb-database
          path: /app/data/duckdb/
        
      - name: Run dbt Data Contracts & Quality Tests
        working-directory: ./dataops/data_transform
        run: |
          dbt deps
          dbt run
          dbt test

      - name: Upload Finalized DuckDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-final-database
          path: /app/data/duckdb/autoimmune.duckdb
          retention-days: 1

  # ==========================================
  # 3. DAGSTER ORCHESTRATION VALIDATION
  # ==========================================
  dagster-orchestration:
    name: Dagster Orchestration Validation
    needs: [data-quality-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dagster & Pipeline Requirements
        run: |
          python -m pip install --upgrade pip
          pip install dlt dbt-core dbt-duckdb dagster dagster-dbt duckdb requests pandas
          
      - name: Setup Mock Volume Paths
        working-directory: ./dataops
        run: |
          mkdir -p data/duckdb
          sudo mkdir -p /app/data
          sudo chown -R $USER:$USER /app
          ln -s ${{ github.workspace }}/dataops/data/duckdb /app/data/duckdb
          
      - name: Compile dbt Manifest
        working-directory: ./dataops/data_transform
        run: |
          dbt deps
          dbt parse
          
      - name: Validate Dagster Asset Materialization
        working-directory: ./dataops
        env:
          DAGSTER_HOME: ${{ github.workspace }}/dagster_home
        run: |
          mkdir -p $DAGSTER_HOME
          dagster asset materialize -f orchestration.py --select "*"

      - name: Upload Dagster Orchestrated Database
        uses: actions/upload-artifact@v4
        with:
          name: orchestrated-duckdb-database
          path: ./dataops/data/duckdb/autoimmune.duckdb
          retention-days: 1

  # ==========================================
  # 4. ML MODEL TRAINING & TESTING
  # ==========================================
  ml-training-and-tests:
    name: ML Training Pipeline & Tests
    needs: [dagster-orchestration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install ML & Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install pytest pytest-cov httpx
          
      - name: Recreate Mock Docker Path for ML Loading
        run: |
          sudo mkdir -p /app/data/duckdb
          sudo chown -R $USER:$USER /app

      - name: Download Orchestrated DuckDB Artifact to App Path
        uses: actions/download-artifact@v4
        with:
          name: orchestrated-duckdb-database
          path: /app/data/duckdb/

      - name: Run ML Training Pipeline
        env:
          PYTHONPATH: .
        run: python ml/train_pipeline.py

      - name: Run Backends Tests
        env:
          PYTHONPATH: .
        run: pytest tests/ml/ -v
        continue-on-error: true

      - name: Run Monitoring Tests
        env:
          PYTHONPATH: .
        run: pytest tests/monitoring/ -v
        continue-on-error: true

  # ==========================================
  # 5. CONTENEURISATION (DOCKER INTEGRATION)
  # ==========================================
  docker-integration:
    name: Docker Full Stack Integration
    needs: [ml-training-and-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Download the database built through the pipeline
      - name: Download Orchestrated DuckDB Artifact
        uses: actions/download-artifact@v4
        with:
          name: orchestrated-duckdb-database
          path: ./dataops/data/duckdb/

      - name: Allocate Swap Space to Prevent OOM
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build

      - name: Start Database and Services
        run: docker compose up -d

      - name: Wait for Backend to be Healthy
        run: |
          echo "Waiting for ML Backend container to start..."
          until curl -s http://localhost:8000/health | grep -q "healthy"; do
            sleep 3
          done
          echo "ML Backend is fully operational!"

      - name: Run Post-Docker E2E Integration Tests
        run: |
          chmod +x tests/e2e_integration.sh
          bash tests/e2e_integration.sh

      - name: Shut Down Stack
        if: always()
        run: docker compose down
  
  # ==========================================
  # 6. CI/CD -> DOCKERHUB PUSH (BLANK)
  # ==========================================
  docker-push:
    name: Push Images to DockerHub
    needs: [docker-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: DockerHub Push Step (Placeholder)
        run: |
          echo "DockerHub push workflow goes here."

  # ==========================================
  # 7. AUTOMATED DEPLOYMENT (KOMODO) (BLANK)
  # ==========================================
  komodo-deploy:
    name: Automated Deployment (Komodo)
    needs: [docker-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Komodo Deployment Step (Placeholder)
        run: |
          echo "Komodo deployment workflow goes here."
