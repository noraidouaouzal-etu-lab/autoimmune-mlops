services:
  dagster:
    container_name: dagster-engine
    build:
      context: ./dataops
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./dataops:/app
      - duckdb_volume:/app/data/duckdb
    environment:
      - PYTHONPATH=/app

  mlflow:
    container_name: mlflow-server
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_volume:/mlflow

  backend:
    container_name: ml-backend
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # CHANGED: Added /data/ to align with the Python scripts
      - duckdb_volume:/app/dataops/data/duckdb
      # Share prediction/app logs with the monitoring + dashboard containers
      - ./monitoring/logs:/app/monitoring/logs
    environment:
      # Training pipeline logs runs + registers the champion here
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - dagster
      - mlflow

  frontend:
    container_name: ml-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  monitoring:
    container_name: ml-monitoring
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    volumes:
      - ./monitoring/logs:/app/monitoring/logs
      - ./monitoring/reports:/app/monitoring/reports
      # CHANGED: Added /data/ to align with the Python scripts
      - duckdb_volume:/app/dataops/data/duckdb
    depends_on:
      - backend
    
  dashboard:
    container_name: ml-dashboard
    build:
      context: .
      dockerfile: monitoring/dashboard/Dockerfile
    ports:
      - "8502:8501"
    environment:
      - BACKEND_URL=http://ml-backend:8000
    volumes:
      - ./monitoring/logs:/app/monitoring/logs
      - ./monitoring/reports:/app/monitoring/reports
    depends_on:
      - backend

volumes:
  duckdb_volume:
  mlflow_volume:
